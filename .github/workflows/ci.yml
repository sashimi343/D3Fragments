name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build D3Fragments.slnx -c Release

      - run: dotnet test D3Fragments.slnx -c Release --no-build

      # Detect broken links and xrefs in the documentation (not deployed)
      - run: dotnet tool restore

      - run: ./scripts/BuildDocs.ps1
        shell: pwsh

      - run: dotnet pack D3Fragments.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
