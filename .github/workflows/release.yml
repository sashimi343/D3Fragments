name: Release

on:
  push:
    tags: ['v*']

# Grant permissions per job only
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # The NuGet Trusted Publishing policy is bound to this environment, which only allows v* tags
    environment: nuget
    permissions:
      contents: write # Create GitHub Release
      id-token: write # Enable NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed to check that the tagged commit is on main

      # Do not publish commits that have not been merged into main
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build D3Fragments.slnx -c Release -p:Version=$VERSION

      - run: dotnet test D3Fragments.slnx -c Release --no-build

      # Build the documentation before publishing packages, so a broken doc build does not leave packages without docs
      - run: dotnet tool restore

      - run: ./scripts/BuildDocs.ps1
        shell: pwsh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - run: dotnet pack D3Fragments.slnx -c Release --no-build -p:Version=$VERSION -o artifacts

      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --draft --generate-notes $([[ "$VERSION" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write    # Deploy documentation to GitHub Pages
      id-token: write # Verify the Pages deployment source
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
